<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ShadowShell Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&display=swap" rel="stylesheet"/>
  <style>
    body {
      background: #0f0f0f;
      font-family: 'Orbitron', sans-serif;
      color: #0ff;
      margin: 0;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h1 {
      font-size: 2.5rem;
      text-shadow: 0 0 10px #0ff;
      margin-bottom: 1rem;
    }
    .typed-wrap {
      font-size: 1.2rem;
      color: #0ff;
      text-shadow: 0 0 5px #0ff;
    }
    .card {
      background: rgba(0, 255, 255, 0.05);
      border: 1px solid #0ff;
      border-radius: 12px;
      padding: 1.5rem;
      margin-top: 2rem;
      width: 90%;
      max-width: 800px;
      box-shadow: 0 0 20px #0ff44c44;
      transition: transform 0.4s ease, box-shadow 0.3s ease;
    }
    .card:hover {
      transform: rotateY(5deg) scale(1.02);
      box-shadow: 0 0 30px #0ff;
    }
    .card pre {
      white-space: pre-wrap;
      word-wrap: break-word;
      color: #fff;
    }
    .footer {
      margin-top: 3rem;
      font-size: 0.8rem;
      color: #888;
    }
  </style>
</head>
<body>
  <h1>ShadowShell v1.5</h1>
  <div class="typed-wrap">
    <span class="typed"></span>
  </div>
  <div class="card">
    <pre>
[+] Target: openai.com
[+] Time  : 2025-07-12 16:00:00
[+] Open ports: 80, 443
[+] Server: nginx/1.18.0
[+] SSL: Valid certificate

[+] Sniper Inject Results:
[+] Payload injected to port 443
[-] Port 80 is filtered
    </pre>
  </div>
  <div class="footer">© 2025 ShadowShell — WahyuOps Elite Recon Unit</div>

  <script src="https://cdn.jsdelivr.net/npm/typed.js@2.1.0"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      new Typed(".typed", {
        strings: [
          "Recon complete.",
          "Inject module active.",
          "Report updated.",
          "Sniper: Target marked."
        ],
        typeSpeed: 50,
        backSpeed: 30,
        loop: true
      });
    });
  </script>
</body>
</html>
